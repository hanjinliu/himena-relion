<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Bonds -->
  <line x1="50" y1="50" x2="50" y2="15" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="50" x2="85" y2="55" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="50" x2="20" y2="70" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="50" x2="60" y2="85" stroke="currentColor" stroke-width="2"/>
  <!-- Carbon atom (center) -->
