  <!-- Hydrogen atoms -->
  <circle cx="50" cy="15" r="10" fill="currentColor" stroke="currentColor" stroke-width="1"/>
  <circle cx="85" cy="55" r="10" fill="currentColor" stroke="currentColor" stroke-width="1"/>
  <circle cx="20" cy="70" r="10" fill="currentColor" stroke="currentColor" stroke-width="1"/>
